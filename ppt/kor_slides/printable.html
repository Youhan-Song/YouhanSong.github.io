<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI & Robotics Portfolio - Print Version</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #1e293b;
    }

    /* Controls Panel */
    .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        background: rgba(15, 23, 42, 0.98);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(34, 211, 238, 0.3);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        max-height: 90vh;
        overflow-y: auto;
        width: 300px;
    }

    .controls h3 {
        color: #22d3ee;
        font-size: 14px;
        margin-bottom: 12px;
        font-weight: 700;
    }

    .controls button {
        display: block;
        width: 100%;
        padding: 10px 16px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .controls button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4);
    }

    .controls button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .controls button.secondary {
        background: rgba(100, 116, 139, 0.5);
    }

    .slide-selector {
        margin: 16px 0;
        padding: 12px;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .slide-selector h4 {
        color: #e2e8f0;
        font-size: 12px;
        margin-bottom: 10px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .slide-selector .select-actions {
        display: flex;
        gap: 8px;
    }

    .slide-selector .select-actions button {
        padding: 4px 8px;
        font-size: 10px;
        margin: 0;
        width: auto;
        background: rgba(100, 116, 139, 0.5);
    }

    .slide-list {
        max-height: 350px;
        overflow-y: auto;
    }

    .slide-item {
        display: flex;
        align-items: center;
        padding: 6px 8px;
        margin-bottom: 4px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 6px;
        cursor: grab;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        user-select: none;
    }

    .slide-item:hover {
        background: rgba(34, 211, 238, 0.1);
    }

    .slide-item.dragging {
        opacity: 0.5;
        background: rgba(34, 211, 238, 0.2);
    }

    .slide-item.drag-over {
        border-top: 2px solid #22d3ee;
        margin-top: -2px;
    }

    .slide-item .drag-handle {
        color: #64748b;
        margin-right: 8px;
        cursor: grab;
        font-size: 10px;
    }

    .slide-item .drag-handle:hover {
        color: #22d3ee;
    }

    .slide-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-right: 10px;
        accent-color: #22d3ee;
    }

    .slide-item label {
        color: #cbd5e1;
        font-size: 11px;
        cursor: pointer;
        flex: 1;
    }

    .slide-item .slide-number {
        color: #64748b;
        font-size: 10px;
        margin-right: 8px;
        min-width: 20px;
    }

    .order-controls {
        display: flex;
        gap: 4px;
        margin-left: 8px;
    }

    .order-controls button {
        width: 20px;
        height: 20px;
        padding: 0;
        margin: 0;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(100, 116, 139, 0.3);
        border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .order-controls button:hover {
        background: rgba(34, 211, 238, 0.3);
        transform: none;
        box-shadow: none;
    }

    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 3px;
        margin-top: 12px;
        overflow: hidden;
        display: none;
    }

    .progress-bar.active {
        display: block;
    }

    .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        border-radius: 3px;
        transition: width 0.3s;
        width: 0%;
    }

    .progress-text {
        color: #94a3b8;
        font-size: 11px;
        margin-top: 8px;
        text-align: center;
        display: none;
    }

    .progress-text.active {
        display: block;
    }

    /* Slide Wrapper - uses iframe like presentation.html */
    .slide-wrapper {
        width: 1280px;
        height: 720px;
        margin: 0 auto 30px auto;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
        position: relative;
    }

    .slide-wrapper.selected {
        box-shadow: 0 0 0 3px #22d3ee, 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .slide-wrapper.excluded {
        opacity: 0.4;
    }

    .slide-wrapper iframe {
        width: 1280px;
        height: 720px;
        border: none;
        background: #0f172a;
    }

    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .loading-overlay .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(34, 211, 238, 0.2);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .loading-overlay p {
        color: white;
        margin-top: 16px;
        font-size: 14px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Print / PDF: one slide per 1280x720 page, in the order shown on this page */
    @page {
        size: 1280px 720px;
        margin: 0;
    }
    @media print {
        .controls, .loading-overlay {
            display: none !important;
        }
        html, body {
            width: 1280px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #0f172a !important;
        }
        .slide-wrapper {
            width: 1280px !important;
            height: 720px !important;
            margin: 0 !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            opacity: 1 !important;
            overflow: hidden !important;
            break-after: page;
            page-break-after: always;
            break-inside: avoid;
        }
        .slide-wrapper.excluded {
            display: none !important;
        }
        .slide-wrapper.last-printed {
            break-after: auto;
            page-break-after: auto;
        }
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
    }

    .print-help {
        margin: 10px 0 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
        font-size: 11px;
        line-height: 1.6;
    }
    .print-help b { color: #22d3ee; }
</style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Loading slides...</p>
    </div>

    <!-- Controls Panel -->
    <div class="controls">
        <h3><i class="fa-solid fa-file-pdf" style="margin-right: 8px;"></i>Export to PDF</h3>

        <!-- Slide Selector -->
        <div class="slide-selector">
            <h4>
                Select & Reorder Slides
                <div class="select-actions">
                    <button onclick="selectAllSlides()">All</button>
                    <button onclick="selectNoSlides()">None</button>
                    <button onclick="resetOrder()">Reset</button>
                </div>
            </h4>
            <p style="font-size: 9px; color: #64748b; margin-bottom: 8px;">Drag to reorder or use arrows</p>
            <div class="slide-list" id="slideList">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <button onclick="exportToPDF()" id="exportBtn">
            <i class="fa-solid fa-file-pdf" style="margin-right: 6px;"></i>PDF로 저장 (인쇄)
        </button>
        <div class="print-help">
            인쇄 창에서 <b>대상: PDF로 저장</b>, <b>여백: 없음</b>, <b>배경 그래픽: 켜기</b>로 설정하세요.
            용지 크기는 16:9(1280×720)로 자동 지정됩니다. Chrome / Edge 권장.
        </div>

        <button onclick="window.location.href='presentation.html'" class="secondary">
            <i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i>Back to Presentation
        </button>
    </div>

    <!-- Slides Container -->
    <div id="slidesContainer"></div>

    <script>
        // Slide configuration (same order as presentation.html)
        const slides = [
            // === INTRO ===
            { file: 'slide01.html', title: 'Title - AI & Robotics Research Engineer' },
            { file: 'slide02.html', title: 'Researcher Profile' },
            { file: 'slide03.html', title: 'Education & Career Timeline' },
            { file: 'slide04.html', title: 'Core Competencies & Skills' },
            // === PROJECTS (latest first; the number is the Project NN badge on the slide) ===
            { file: 'slide14.html', title: '01 Universal VLA Model' },
            { file: 'slide15.html', title: '02 EASIS - Swarm Intelligence System' },
            { file: 'slide18.html', title: '03 Smart Monitoring System' },
            { file: 'slide05.html', title: '04 Korean LLM Development' },
            { file: 'slide13.html', title: '05 NVIDIA Jetson AMR' },
            { file: 'slide06.html', title: '06 SeeU Track - Vehicle & Person Detection' },
            { file: 'slide07.html', title: '07 Face Recognition System' },
            { file: 'slide09.html', title: '08 Tanzania Smart Gate' },
            { file: 'slide08.html', title: '09 SeeU ID - ID Card OCR' },
            { file: 'slide10.html', title: '10 Gumi Metaverse - Safety Detection' },
            { file: 'slide11.html', title: '11 AVA - Autonomous Vehicle for All' },
            { file: 'slide19.html', title: '11 Master\'s Thesis 1/3 - Overview' },
            { file: 'slide20.html', title: '11 Master\'s Thesis 2/3 - YOLOv7 Architecture' },
            { file: 'slide21.html', title: '11 Master\'s Thesis 3/3 - Results' },
            { file: 'slide12.html', title: '12 Robotic Arm Object Relocator' },
            // === CLOSING ===
            { file: 'slide16.html', title: 'Key Achievements Summary' },
            { file: 'slide17.html', title: 'Thank You' },
        ];

        // Track selected slides (all selected by default)
        let selectedSlides = new Set(slides.map((_, i) => i));
        // Track slide order for export (array of original indices)
        let slideOrder = slides.map((_, i) => i);
        // Store original order for reset
        const originalOrder = slides.map((_, i) => i);
        let loadedIframes = 0;

        const container = document.getElementById('slidesContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // Build slide selector UI with drag and drop
        function buildSlideSelector() {
            const slideList = document.getElementById('slideList');
            slideList.innerHTML = slideOrder.map((originalIndex, orderIndex) => `
                <div class="slide-item"
                     draggable="true"
                     data-order-index="${orderIndex}"
                     data-original-index="${originalIndex}"
                     ondragstart="handleDragStart(event)"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event)"
                     ondragend="handleDragEnd(event)"
                     ondragleave="handleDragLeave(event)">
                    <span class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></span>
                    <input type="checkbox" id="slide-check-${originalIndex}"
                           ${selectedSlides.has(originalIndex) ? 'checked' : ''}
                           onchange="toggleSlide(${originalIndex})"
                           onclick="event.stopPropagation()">
                    <span class="slide-number">${orderIndex + 1}</span>
                    <label for="slide-check-${originalIndex}" onclick="event.stopPropagation()">${slides[originalIndex].title}</label>
                    <div class="order-controls">
                        <button onclick="moveSlideUp(${orderIndex}); event.stopPropagation();" ${orderIndex === 0 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button onclick="moveSlideDown(${orderIndex}); event.stopPropagation();" ${orderIndex === slideOrder.length - 1 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Drag and drop handlers
        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = e.target.closest('.slide-item');
            draggedItem.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedItem.dataset.orderIndex);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.slide-item');
            if (target && target !== draggedItem) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.slide-item');
            if (target) {
                target.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.slide-item');
            if (target) {
                target.classList.remove('drag-over');
            }

            if (!target || target === draggedItem) return;

            const fromIndex = parseInt(draggedItem.dataset.orderIndex);
            const toIndex = parseInt(target.dataset.orderIndex);

            // Reorder the slideOrder array
            const [movedItem] = slideOrder.splice(fromIndex, 1);
            slideOrder.splice(toIndex, 0, movedItem);

            // Rebuild UI
            buildSlideSelector();
            updateSlideVisuals();
        }

        function handleDragEnd(e) {
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
            }
            document.querySelectorAll('.slide-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            draggedItem = null;
        }

        // Move slide up/down with buttons
        function moveSlideUp(orderIndex) {
            if (orderIndex <= 0) return;
            [slideOrder[orderIndex], slideOrder[orderIndex - 1]] = [slideOrder[orderIndex - 1], slideOrder[orderIndex]];
            buildSlideSelector();
            updateSlideVisuals();
        }

        function moveSlideDown(orderIndex) {
            if (orderIndex >= slideOrder.length - 1) return;
            [slideOrder[orderIndex], slideOrder[orderIndex + 1]] = [slideOrder[orderIndex + 1], slideOrder[orderIndex]];
            buildSlideSelector();
            updateSlideVisuals();
        }

        // Reset to original order
        function resetOrder() {
            slideOrder = [...originalOrder];
            buildSlideSelector();
            updateSlideVisuals();
        }

        function toggleSlideFromItem(index, event) {
            if (event.target.tagName !== 'INPUT') {
                toggleSlide(index);
                document.getElementById(`slide-check-${index}`).checked = selectedSlides.has(index);
            }
        }

        function toggleSlide(index) {
            if (selectedSlides.has(index)) {
                selectedSlides.delete(index);
            } else {
                selectedSlides.add(index);
            }
            updateSlideVisuals();
        }

        function selectAllSlides() {
            selectedSlides = new Set(slides.map((_, i) => i));
            updateSlideVisuals();
            buildSlideSelector();
        }

        function selectNoSlides() {
            selectedSlides.clear();
            updateSlideVisuals();
            buildSlideSelector();
        }

        function updateSlideVisuals() {
            document.querySelectorAll('.slide-wrapper').forEach((wrapper) => {
                const index = Number(wrapper.dataset.index);
                wrapper.classList.toggle('selected', selectedSlides.has(index));
                wrapper.classList.toggle('excluded', !selectedSlides.has(index));
            });
            applySlideOrder();
        }

        // Keep the page (and therefore the printed PDF) in the order chosen in the panel.
        // Only wrappers that are out of place are moved, because moving an iframe reloads it.
        function applySlideOrder() {
            slideOrder.forEach((originalIndex, position) => {
                const wrapper = document.getElementById(`slide-wrapper-${originalIndex}`);
                if (wrapper && container.children[position] !== wrapper) {
                    container.insertBefore(wrapper, container.children[position] || null);
                }
            });
            const printed = slideOrder.filter(idx => selectedSlides.has(idx));
            document.querySelectorAll('.slide-wrapper').forEach(w => w.classList.remove('last-printed'));
            if (printed.length) {
                document.getElementById(`slide-wrapper-${printed[printed.length - 1]}`).classList.add('last-printed');
            }
        }

        // Load all slides using iframes (same as presentation.html)
        function loadSlides() {
            slides.forEach((slide, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slide-wrapper selected';
                wrapper.id = `slide-wrapper-${index}`;
                wrapper.dataset.index = index;

                const iframe = document.createElement('iframe');
                iframe.id = `slide-iframe-${index}`;
                iframe.src = slide.file;
                iframe.onload = function() {
                    loadedIframes++;
                    loadingText.textContent = `Loading slide ${loadedIframes}/${slides.length}: ${slides[loadedIframes - 1]?.title || ''}`;

                    // When all iframes are loaded
                    if (loadedIframes === slides.length) {
                        // Wait longer for charts to fully initialize (ECharts needs time)
                        loadingText.textContent = 'Initializing charts...';
                        setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                        }, 1500);
                    }
                };

                wrapper.appendChild(iframe);
                container.appendChild(wrapper);
            });

            // Build slide selector
            buildSlideSelector();
            applySlideOrder();
        }

        // Export through the browser's own print engine: text stays sharp and selectable,
        // links keep working, and the page looks exactly like the slides on screen.
        function exportToPDF() {
            if (![...selectedSlides].length) {
                alert('내보낼 슬라이드를 한 장 이상 선택하세요.');
                return;
            }
            applySlideOrder();
            window.print();
        }

        // Start loading slides
        loadSlides();
    </script>
</body>
</html>
